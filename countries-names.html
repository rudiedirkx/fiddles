<script>
const svg = document.querySelector("svg");
const tooltip = document.getElementById("tooltip");

const zoom = 2.5;
const dragThreshold = 5;
const bounds = svg.getBBox();

let centerX = bounds.x + bounds.width / 2;
let centerY = bounds.y + bounds.height / 2;
let scale = 1;
let dragStart = null;
let dragged = false;

function clampAxis(center, viewSize, boundStart, boundSize) {
	if (viewSize >= boundSize) {
		return boundStart + boundSize / 2;
	}
	const min = boundStart + viewSize / 2;
	const max = boundStart + boundSize - viewSize / 2;
	return Math.min(Math.max(center, min), max);
}

function render() {
	const rect = svg.getBoundingClientRect();
	const fitScale = Math.min(rect.width / bounds.width, rect.height / bounds.height);
	scale = zoom * fitScale;
	const viewWidth = rect.width / scale;
	const viewHeight = rect.height / scale;
	centerX = clampAxis(centerX, viewWidth, bounds.x, bounds.width);
	centerY = clampAxis(centerY, viewHeight, bounds.y, bounds.height);
	const left = centerX - viewWidth / 2;
	const top = centerY - viewHeight / 2;
	svg.setAttribute("viewBox", `${left} ${top} ${viewWidth} ${viewHeight}`);
}

function showTooltip(country, e) {
	tooltip.innerHTML = `<strong>${country.dataset.name}</strong><br/>${country.dataset.cat}`;
	tooltip.style.left = (e.pageX + 15) + "px";
	tooltip.style.top = (e.pageY - 20) + "px";
	tooltip.style.opacity = 1;
}

function hideTooltip() {
	tooltip.style.opacity = 0;
}

function endDrag() {
	dragStart = null;
}

svg.addEventListener("pointerdown", e => {
	if (!e.isPrimary || e.button !== 0) {
		return;
	}
	dragStart = { x: e.clientX, y: e.clientY };
	dragged = false;
});

window.addEventListener("pointermove", e => {
	if (!dragStart || !e.isPrimary) {
		return;
	}
	const dx = e.clientX - dragStart.x;
	const dy = e.clientY - dragStart.y;
	if (!dragged && Math.hypot(dx, dy) < dragThreshold) {
		return;
	}
	dragged = true;
	dragStart = { x: e.clientX, y: e.clientY };
	centerX -= dx / scale;
	centerY -= dy / scale;
	hideTooltip();
	render();
});

window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);

svg.addEventListener("click", e => {
	if (dragged) {
		return;
	}
	const country = e.target.closest(".country");
	if (country) {
		showTooltip(country, e);
	} else {
		hideTooltip();
	}
});

window.addEventListener("resize", render);

render();
</script>
